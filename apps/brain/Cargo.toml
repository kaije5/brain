[package]
name = "brain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
cortexd = { path = "../cortexd" }
crossterm = "0.28"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1.24", features = ["serde", "v7"] }

zeroize = "1.8"
cortex-keyring = { path = "../../crates/cortex-keyring" }


[dev-dependencies]
ratatui = "0.30"
tempfile = "3.23"
