[package]
name = "brain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
cortexd = { path = "../cortexd" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1.24", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23"
[target.'cfg(windows)'.dependencies]
keyring-core = "1.0"
windows-native-keyring-store = "1.1"
zeroize = "1.8"
