[package]
name = "cortexd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cortex-application = { path = "../../crates/cortex-application" }
cortex-domain = { path = "../../crates/cortex-domain" }
cortex-storage = { path = "../../crates/cortex-storage" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1.24", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23"
