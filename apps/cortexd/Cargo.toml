[package]
name = "cortexd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cortex-application = { path = "../../crates/cortex-application" }
cortex-domain = { path = "../../crates/cortex-domain" }
cortex-storage = { path = "../../crates/cortex-storage" }
cortex-search = { path = "../../crates/cortex-search" }
cortex-inference = { path = "../../crates/cortex-inference" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "1.24", features = ["serde", "v7"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
windows-native-keyring-store = "1.1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.23"
