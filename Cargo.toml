[workspace]
members = [
    "crates/cortex-domain",
    "crates/cortex-application",
    "crates/cortex-inference",
    "crates/cortex-search",
    "crates/cortex-storage",
    "apps/cortexd",
    "apps/brain",
    "apps/cortex-mcp-gateway",
    "crates/cortex-mcp",
    "tests/e2e",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
