[package]
name = "cortex-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
cortex-application = { path = "../cortex-application" }
cortexd = { path = "../../apps/cortexd" }
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
rmcp = { version = "1.4", features = ["server", "transport-streamable-http-server"] }
schemars = { version = "1.1", features = ["chrono04", "uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt", "time"] }
tokio-util = "0.7"
tower-service = "0.3"
uuid = { version = "1.24", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23"
