[package]
name = "cortex-search"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cortex-application = { path = "../cortex-application" }
cortex-domain = { path = "../cortex-domain" }
cortex-vault = { path = "../cortex-vault" }
sha2 = "0.10"
tokio = { version = "1.47", features = ["time"] }

[dev-dependencies]
cortex-storage = { path = "../cortex-storage" }
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.24", features = ["v7"] }
sha2 = "0.10"
