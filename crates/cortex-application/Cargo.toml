[package]
name = "cortex-application"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
cortex-domain = { path = "../cortex-domain" }
serde_json = "1.0"
uuid = { version = "1.24", features = ["v7"] }

[dev-dependencies]
sha2 = "0.11.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
