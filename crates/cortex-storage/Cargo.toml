[package]
name = "cortex-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
cortex-application = { path = "../cortex-application" }
cortex-domain = { path = "../cortex-domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
uuid = { version = "1.24", features = ["v7"] }

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
